<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實時監控入口 - 專業彙整版</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; color: #0f172a; display: flex; justify-content: center; padding: 2rem 1.5rem; margin: 0; }
        .container { background: white; padding: 2.5rem; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 100%; max-width: 720px; }
        .back-link { text-decoration: none; color: #6366f1; font-weight: bold; font-size: 0.9rem; display: inline-block; margin-bottom: 1rem; }
        h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #1e293b; text-align: center; }
        
        .controls { margin-bottom: 2rem; background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .control-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #64748b; margin-bottom: 8px; }
        input[type="date"] { width: 100%; padding: 12px; font-size: 1rem; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: border-color 0.2s; }
        input[type="date"]:focus { border-color: #6366f1; }

        .section-header { font-size: 1rem; color: #64748b; margin: 2rem 0 1rem 0; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; margin-left: 15px; }

        .report-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 2rem; }
        
        /* 卡片設計優化 */
        .card { 
            display: flex; 
            flex-direction: column; 
            padding: 1.5rem; 
            background: #fff; 
            border: 1px solid #e2e8f0; 
            border-radius: 20px; 
            transition: all 0.2s ease; 
            position: relative;
        }
        .card:hover { border-color: #6366f1; box-shadow: 0 12px 24px rgba(99, 102, 241, 0.08); }

        .card-main-link { text-decoration: none; display: block; margin-bottom: 12px; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .title { font-weight: 700; color: #1e293b; font-size: 1.2rem; display: block; margin-top: 4px; }
        .badge { font-size: 0.7rem; padding: 3px 10px; border-radius: 8px; font-weight: 800; color: white; text-transform: uppercase; }
        
        .file-info { font-size: 0.8rem; color: #94a3b8; font-family: 'Cascadia Code', monospace; background: #f8fafc; padding: 4px 8px; border-radius: 6px; display: inline-block; margin-top: 8px; }
        .status-dot { color: #10b981; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .status-dot::before { content: "●"; font-size: 1.2rem; }

        /* 歷史版本下拉選單 */
        .history-area { border-top: 1px solid #f1f5f9; pt: 12px; margin-top: 5px; }
        .history-select { 
            width: 100%; 
            padding: 10px; 
            font-size: 0.85rem; 
            border-radius: 10px; 
            border: 1px solid #e2e8f0; 
            background: #f8fafc; 
            color: #475569; 
            cursor: pointer;
            outline: none;
        }
        .history-select:hover { background: #f1f5f9; border-color: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← 返回儀表板</a>
    <h1>🛰️ 實時監控入口</h1>

    <div class="controls">
        <div class="control-group">
            <label>📅 選擇報告日期目錄</label>
            <input type="date" id="datePicker" onchange="loadDynamicReports()">
        </div>
    </div>

    <div id="dynamicContent"></div>
</div>

<script>
    // 配置類型樣式
    const typeConfig = {
        'trend': { label: '趨勢回測', color: '#6366f1' },
        'live': { label: '實時監控', color: '#10b981' },
        'default': { label: '數據報告', color: '#64748b' }
    };

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        let dateVal = urlParams.get('date') || new Date().toISOString().split('T')[0];
        document.getElementById('datePicker').value = dateVal;
        loadDynamicReports();
    };

    async function loadDynamicReports() {
        const dateInput = document.getElementById('datePicker').value;
        const dateDir = dateInput.replace(/-/g, '');
        const displayArea = document.getElementById('dynamicContent');

        displayArea.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:2rem;">正在檢索檔案結構...</div>';

        try {
            const url = `report/${dateDir}/files.json?t=${new Date().getTime()}`;
            const response = await fetch(url);

            if (!response.ok) throw new Error(`目錄 report/${dateDir} 尚未生成報告`);

            const allFiles = await response.json();

            // 過濾邏輯
            const filteredFiles = allFiles.filter(file => {
                const name = file.toLowerCase();
                return name.endsWith('.html') && 
                       !name.startsWith('all-') && 
                       (name.includes('live') || name.includes('trend'));
            });

            renderSmartGroups(filteredFiles, dateDir);

        } catch (error) {
            displayArea.innerHTML = `
                <div style="text-align:center; color:#ef4444; padding:2.5rem; border: 2px dashed #e2e8f0; border-radius:20px;">
                    ⚠️ 無法讀取報告<br>
                    <small style="color:#64748b; display:block; margin-top:10px;">${error.message}</small>
                </div>`;
        }
    }

    function renderSmartGroups(files, dateDir) {
        const displayArea = document.getElementById('dynamicContent');
        const groups = {}; // 結構: { baseName: { main: str, history: [] } }

        // 1. 檔案分類與聚合
        files.forEach(file => {
            const dateMatch = file.match(/\d{8}/);
            const isHistory = !!dateMatch;
            
            // 提取基礎名稱，例如 "2330-live-20260428.html" -> "2330-live"
            let baseName = file.replace('.html', '');
            if (isHistory) {
                baseName = baseName.replace(new RegExp(`-${dateMatch[0]}$`), '');
            }

            if (!groups[baseName]) {
                groups[baseName] = { main: null, history: [] };
            }

            if (isHistory) {
                groups[baseName].history.push(file);
            } else {
                groups[baseName].main = file;
            }
        });

        const sortedBases = Object.keys(groups).sort();
        if (sortedBases.length === 0) {
            displayArea.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:3rem;">📅 該日期下無匹配的報告檔案</div>`;
            return;
        }

        displayArea.innerHTML = '';

        // 2. 依照前綴分組顯示 (例如 2330 系列, 2454 系列)
        const prefixGroups = {};
        sortedBases.forEach(base => {
            const prefix = base.split('-')[0];
            if (!prefixGroups[prefix]) prefixGroups[prefix] = [];
            prefixGroups[prefix].push(base);
        });

        Object.keys(prefixGroups).sort().forEach(prefix => {
            const section = document.createElement('div');
            section.innerHTML = `<div class="section-header">${prefix} 系列</div>`;
            const grid = document.createElement('div');
            grid.className = 'report-grid';

            prefixGroups[prefix].forEach(base => {
                const item = groups[base];
                const displayFile = item.main || item.history.sort().reverse()[0];
                const typeKey = base.includes('trend') ? 'trend' : 'live';
                const config = typeConfig[typeKey];

                const card = document.createElement('div');
                card.className = 'card';

                // 歷史選單 HTML
                let historySelect = '';
                if (item.history.length > 0) {
                    const options = item.history.sort().reverse().map(h => {
                        const d = h.match(/\d{8}/)[0];
                        return `<option value="report/${dateDir}/${h}">🕒 歷史日期: ${d}</option>`;
                    }).join('');
                    
                    historySelect = `
                        <div class="history-area">
                            <select class="history-select" onchange="if(this.value) window.open(this.value, '_blank')">
                                <option value="">查看歷史版本 (${item.history.length})</option>
                                ${options}
                            </select>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <a href="report/${dateDir}/${displayFile}" target="_blank" class="card-main-link">
                        <div class="card-header">
                            <span class="badge" style="background:${config.color}">${config.label}</span>
                            <span class="status-dot">最新</span>
                        </div>
                        <span class="title">${base.toUpperCase()}</span>
                        <div class="file-info">📄 ${displayFile}</div>
                    </a>
                    ${historySelect}
                `;
                grid.appendChild(card);
            });
            section.appendChild(grid);
            displayArea.appendChild(section);
        });
    }
</script>
</body>
</html>
