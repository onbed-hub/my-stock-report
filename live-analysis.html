<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實時監控入口 - 強調標題版</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; color: #0f172a; display: flex; justify-content: center; padding: 2rem 1.5rem; margin: 0; }
        .container { background: white; padding: 2.5rem; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 100%; max-width: 720px; }
        .back-link { text-decoration: none; color: #6366f1; font-weight: bold; font-size: 0.9rem; display: inline-block; margin-bottom: 1rem; }
        h1 { font-size: 2rem; margin-bottom: 1.5rem; color: #1e293b; text-align: center; border-bottom: 3px solid #e2e8f0; padding-bottom: 15px; }
        
        .controls { margin-bottom: 2rem; background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .control-group label { display: block; font-size: 0.9rem; font-weight: 800; color: #475569; margin-bottom: 8px; }
        input[type="date"] { width: 100%; padding: 12px; font-size: 1.1rem; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; }

        .section-header { font-size: 1.1rem; color: #1e3a8a; margin: 2.5rem 0 1rem 0; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; display: flex; align-items: center; }
        .section-header::after { content: ""; flex: 1; height: 2px; background: #6366f1; margin-left: 15px; opacity: 0.3; }

        .report-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 2rem; }
        
        .card { 
            display: flex; 
            flex-direction: column; 
            padding: 1.8rem; 
            background: #fff; 
            border: 2px solid #e2e8f0; 
            border-radius: 24px; 
            transition: all 0.25s ease;
        }
        .card:hover { border-color: #6366f1; transform: translateY(-3px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.12); }

        .card-main-link { text-decoration: none; display: block; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        /* 💡 這裡就是你問的「大標題」 */
        .title { 
            font-weight: 900; 
            color: #0f172a; 
            font-size: 1.5rem; /* 加大字體 */
            display: block; 
            margin: 10px 0;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .badge { font-size: 0.75rem; padding: 4px 12px; border-radius: 8px; font-weight: 800; color: white; }
        .file-info { font-size: 0.85rem; color: #64748b; font-family: 'Consolas', monospace; background: #f1f5f9; padding: 6px 12px; border-radius: 8px; margin-top: 5px; }
        .status-dot { color: #10b981; font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .status-dot::before { content: "●"; font-size: 1.4rem; }

        .history-area { border-top: 1px solid #f1f5f9; margin-top: 15px; padding-top: 15px; }
        .history-select { 
            width: 100%; 
            padding: 12px; 
            font-size: 0.9rem; 
            border-radius: 12px; 
            border: 2px solid #e2e8f0; 
            background: #ffffff; 
            color: #1e293b; 
            cursor: pointer;
            font-weight: 600;
        }
        .history-select:hover { border-color: #6366f1; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← 返回儀表板</a>
    <h1>🛰️ 實時監控入口</h1>

    <div class="controls">
        <div class="control-group">
            <label>📅 選擇報告日期目錄</label>
            <input type="date" id="datePicker" onchange="loadDynamicReports()">
        </div>
    </div>

    <div id="dynamicContent"></div>
</div>

<script>
    const typeConfig = {
        'trend': { label: '趨勢報告', color: '#8b5cf6' }, // 紫色
        'live': { label: '即時監控', color: '#10b981' },  // 綠色
        'default': { label: '數據報告', color: '#64748b' }
    };

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        let dateVal = urlParams.get('date') || new Date().toISOString().split('T')[0];
        document.getElementById('datePicker').value = dateVal;
        loadDynamicReports();
    };

    async function loadDynamicReports() {
        const dateInput = document.getElementById('datePicker').value;
        const dateDir = dateInput.replace(/-/g, '');
        const displayArea = document.getElementById('dynamicContent');

        displayArea.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:2rem;">🔍 正在掃描檔案...</div>';

        try {
            const url = `report/${dateDir}/files.json?t=${new Date().getTime()}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`找不到目錄: report/${dateDir}`);

            const allFiles = await response.json();
            const filteredFiles = allFiles.filter(f => {
                const n = f.toLowerCase();
                return n.endsWith('.html') && !n.startsWith('all-') && (n.includes('live') || n.includes('report'));
            });

            renderSmartGroups(filteredFiles, dateDir);
        } catch (error) {
            displayArea.innerHTML = `<div style="text-align:center; color:#ef4444; padding:2.5rem; border: 2px dashed #e2e8f0; border-radius:20px;">⚠️ 無法讀取: ${error.message}</div>`;
        }
    }

    function renderSmartGroups(files, dateDir) {
        const displayArea = document.getElementById('dynamicContent');
        const groups = {}; 

        files.forEach(file => {
            const tsMatch = file.match(/\d{8,12}/); // 抓取日期或時間戳
            const isHistory = !!tsMatch;
            let baseName = file.replace('.html', '');
            if (isHistory) {
                baseName = baseName.replace(`-${tsMatch[0]}`, '');
            }

            if (!groups[baseName]) {
                groups[baseName] = { main: null, history: [] };
            }
            if (isHistory) groups[baseName].history.push(file);
            else groups[baseName].main = file;
        });

        const sortedBases = Object.keys(groups).sort();
        if (sortedBases.length === 0) {
            displayArea.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:3rem;">📅 該日期目錄下無報告檔案</div>`;
            return;
        }

        displayArea.innerHTML = '';

        // 依照前綴分組 (如 BOR, DAYAN)
        const prefixGroups = {};
        sortedBases.forEach(base => {
            const prefix = base.split('-')[0];
            if (!prefixGroups[prefix]) prefixGroups[prefix] = [];
            prefixGroups[prefix].push(base);
        });

        Object.keys(prefixGroups).sort().forEach(prefix => {
            const section = document.createElement('div');
            section.innerHTML = `<div class="section-header">${prefix.toUpperCase()} 分析系列</div>`;
            const grid = document.createElement('div');
            grid.className = 'report-grid';

            prefixGroups[prefix].forEach(base => {
                const item = groups[base];
                const displayFile = item.main || item.history.sort().reverse()[0];
                const typeKey = base.includes('report') ? 'trend' : 'live';
                const config = typeConfig[typeKey] || typeConfig['default'];

                const card = document.createElement('div');
                card.className = 'card';

                let historySelect = '';
                if (item.history.length > 0) {
                    const options = item.history.sort().reverse().map(h => {
                        const ts = h.match(/\d{8,12}/)[0];
                        const displayTs = ts.length === 12 
                            ? `${ts.substring(4,6)}/${ts.substring(6,8)} ${ts.substring(8,10)}:${ts.substring(10,12)}`
                            : `${ts.substring(4,6)}/${ts.substring(6,8)}`;
                        return `<option value="report/${dateDir}/${h}">🕒 歷史紀錄: ${displayTs}</option>`;
                    }).join('');
                    
                    historySelect = `
                        <div class="history-area">
                            <select class="history-select" onchange="if(this.value) window.open(this.value, '_blank')">
                                <option value="">📜 查看其它時間版本 (${item.history.length})</option>
                                ${options}
                            </select>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <a href="report/${dateDir}/${displayFile}" target="_blank" class="card-main-link" onclick="console.log('正在跳轉至: report/${dateDir}/${displayFile}')">
                        <div class="card-header">
                            <span class="badge" style="background:${config.color}">${config.label}</span>
                            <span class="status-dot">最新</span>
                        </div>
                        <span class="title">${base.toUpperCase()}</span>
                        <div class="file-info">📄 ${displayFile}</div>
                    </a>
                    ${historySelect}
                `;
                grid.appendChild(card);
            });
            section.appendChild(grid);
            displayArea.appendChild(section);
        });
    }
</script>
</body>
</html>
