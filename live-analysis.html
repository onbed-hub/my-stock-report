<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實時監控入口</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; color: #0f172a; display: flex; justify-content: center; padding: 2rem 1.5rem; margin: 0; }
        .container { background: white; padding: 2.5rem; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 100%; max-width: 760px; }
        .back-link { text-decoration: none; color: #6366f1; font-weight: bold; font-size: 0.9rem; display: inline-block; margin-bottom: 1rem; }
        h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #1e293b; text-align: center; }
        .controls { margin-bottom: 2rem; background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .control-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #64748b; margin-bottom: 8px; }
        input[type="date"], .history-select { width: 100%; padding: 12px; font-size: 1rem; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: border-color 0.2s; }
        input[type="date"]:focus, .history-select:focus { border-color: #6366f1; }

        .section-header { font-size: 1rem; color: #1e3a8a; margin: 2rem 0 1rem 0; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #cbd5e1; margin-left: 15px; }

        .report-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 2rem; }
        .card { display: flex; flex-direction: column; padding: 1.5rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; transition: all 0.2s ease; }
        .card:hover { border-color: #6366f1; box-shadow: 0 12px 24px rgba(99, 102, 241, 0.08); }
        .card-main-link { text-decoration: none; display: block; }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .title { font-weight: 800; color: #0f172a; font-size: 1.25rem; display: block; margin: 8px 0; }
        .badge { font-size: 0.7rem; padding: 3px 10px; border-radius: 8px; font-weight: 800; color: white; text-transform: uppercase; }
        .file-info { font-size: 0.8rem; color: #94a3b8; font-family: monospace; background: #f8fafc; padding: 4px 8px; border-radius: 6px; display: inline-block; }
        .status-dot { color: #10b981; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .status-dot::before { content: "●"; }

        .history-area { border-top: 1px solid #f1f5f9; margin-top: 15px; padding-top: 12px; }
        .history-select.sub { padding: 8px; font-size: 0.85rem; border-radius: 10px; background: #f8fafc; color: #475569; border-width: 1px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← 返回儀表板</a>
    <h1>🛰️ 實時監控入口</h1>

    <div class="controls">
        <div class="control-group" style="margin-bottom: 15px;">
            <label>📅 報告日期目錄</label>
            <input type="date" id="datePicker" onchange="loadDynamicReports()">
        </div>

        <div class="control-group" id="quickNav" style="display:none;">
            <label>🔍 個股報告選單 (僅限 HTML)</label>
            <select id="stockSelector" class="history-select" style="border: 2px solid #6366f1; font-weight: bold;" onchange="if(this.value) window.open(this.value, '_blank')">
                <option value="">請選擇股號...</option>
            </select>
        </div>
    </div>

    <div id="dynamicContent"></div>
</div>

<script>
    const typeConfig = {
        'trend': { label: '回測報告', color: '#8b5cf6' },
        'live': { label: '即時監控', color: '#10b981' },
        'default': { label: '數據報告', color: '#64748b' }
    };

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        let dateVal = urlParams.get('date') || new Date().toISOString().split('T')[0];
        document.getElementById('datePicker').value = dateVal;
        loadDynamicReports();
    };

    async function loadDynamicReports() {
        const dateInput = document.getElementById('datePicker').value;
        const dateDir = dateInput.replace(/-/g, '');
        const displayArea = document.getElementById('dynamicContent');
        const quickNav = document.getElementById('quickNav');
        displayArea.innerHTML = '正在掃描檔案...';
        quickNav.style.display = 'none';

        try {
            const url = `report/${dateDir}/files.json?t=${new Date().getTime()}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('尚未生成報告');

            const allFiles = await response.json();

            // ✨ 排除特定關鍵字，並根據副檔名與目錄決定保留哪些檔案
            // 過濾：排除 all- 系列，保留 HTML 和 data/ 內的 TXT
            const filtered = allFiles.filter(f => {
                // 1. 全部轉小寫進行比對
                const pathLower = f.toLowerCase();
                const fileName = f.split('/').pop().toLowerCase();

                const isHtml = f.endsWith('.html');
                const isTxt = f.endsWith('.txt');
                const isInDataDir = f.includes('data/');

                // 2. 建立排除清單 (包含目錄名與檔名)
                const shouldExclude =
                    pathLower.includes('vietnam-') ||
                    pathLower.includes('.vn') ||       // 擋掉 BCM.VN, BID.VN
                    pathLower.includes('all-') ||
                    pathLower.includes('/vn/');        // 預防未來有 vn/ 目錄

                if (shouldExclude) return false;

                // 3. 保留規則：HTML 直接通過，TXT 則必須在 data/ 目錄內
                if (isHtml) return true;
                if (isTxt && isInDataDir) return true;
                
                return false;
            });

            renderSmartGroups(filtered, dateDir);
        } catch (e) {
            displayArea.innerHTML = `<div style="text-align:center;color:#ef4444;margin-top:20px;">⚠️ ${e.message}</div>`;
        }
    }

    function renderSmartGroups(files, dateDir) {
        const displayArea = document.getElementById('dynamicContent');
        const stockSelector = document.getElementById('stockSelector');
        const quickNav = document.getElementById('quickNav');
        const groups = {};

        stockSelector.innerHTML = '<option value="">請選擇股號 (快速跳轉)...</option>';

        // 1. 檔案聚合邏輯
        files.forEach(file => {
            const fileName = file.split('/').pop();
            const tsMatch = fileName.match(/\d{8,12}/);
            const isHistory = !!tsMatch;
            let baseName = fileName.replace('.html', '').replace('.txt', '');
            if (isHistory) baseName = baseName.replace(`-${tsMatch[0]}`, '');

            const isStock = /^\d/.test(fileName);

            if (!groups[baseName]) {
                groups[baseName] = { main: null, history: [], isStock: isStock };
            }

            if (isHistory) {
                groups[baseName].history.push(file);
            } else {
                // 優先使用 HTML 作為主要檔案
                if (!groups[baseName].main || file.endsWith('.html')) {
                    groups[baseName].main = file;
                }
            }
        });

        const sortedBases = Object.keys(groups).sort();
        let hasStockHtml = false;

        // 2. 生成個股下拉選單
        sortedBases.forEach(base => {
            const item = groups[base];
            if (item.isStock && item.main && item.main.endsWith('.html')) {
                const opt = document.createElement('option');
                opt.value = `report/${dateDir}/${item.main}`;
                opt.textContent = `📈 ${base.toUpperCase()}`;
                stockSelector.appendChild(opt);
                hasStockHtml = true;
            }
        });
        if (hasStockHtml) quickNav.style.display = 'block';

        // 3. 處理系列卡片 (篩選出非個股且必須有 HTML 的項目)
        const prefixGroups = {};
        sortedBases.forEach(base => {
            const item = groups[base];
            // 關鍵：不是個股、且主檔案必須是 HTML 才能出現在卡片區
            if (!item.isStock && item.main && item.main.endsWith('.html')) {
                const prefix = base.split('-')[0].toUpperCase();
                if (!prefixGroups[prefix]) prefixGroups[prefix] = [];
                prefixGroups[prefix].push(base);
            }
        });

        // 4. 渲染卡片
        Object.keys(prefixGroups).sort().forEach(prefix => {
            const section = document.createElement('div');
            section.innerHTML = `<div class="section-header">${prefix} 系列</div>`;
            const grid = document.createElement('div');
            grid.className = 'report-grid';

            prefixGroups[prefix].forEach(base => {
                const item = groups[base];
                const displayFile = item.main;
                const finalPath = `report/${dateDir}/${displayFile}`;
                let typeKey = base.includes('report') ? 'trend' : 'live';
                const config = typeConfig[typeKey] || typeConfig['default'];

                const card = document.createElement('div');
                card.className = 'card';

                // 歷史版本過濾：只顯示 HTML
                let historyHtml = '';
                const htmlHistory = item.history.filter(h => h.endsWith('.html')).sort().reverse();
                if (htmlHistory.length > 0) {
                    const options = htmlHistory.map(h => {
                        const ts = h.match(/\d{8,12}/)[0];
                        return `<option value="report/${dateDir}/${h}">🕒 ${ts}</option>`;
                    }).join('');
                    historyHtml = `<div class="history-area"><select class="history-select sub" onchange="if(this.value) window.open(this.value, '_blank')"><option value="">📜 歷史版本 (${htmlHistory.length})</option>${options}</select></div>`;
                }

                card.innerHTML = `
                    <a href="${finalPath}" target="_blank" class="card-main-link">
                        <div class="card-header">
                            <span class="badge" style="background:${config.color}">${config.label}</span>
                            <span class="status-dot">● 最新</span>
                        </div>
                        <span class="title">${base.toUpperCase()}</span>
                        <div class="file-info">📄 ${displayFile}</div>
                    </a>
                    ${historyHtml}
                `;
                grid.appendChild(card);
            });
            section.appendChild(grid);
            displayArea.appendChild(section);
        });
    }

</script>
</body>
</html>
