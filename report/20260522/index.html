<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>stock-Quantum V3 Pro 監控儀表板 (20260522)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { margin-top: 0; color: #0f172a; font-size: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .meta-info { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        th { background: #f1f5f9; padding: 12px; font-weight: 600; color: #475569; border-bottom: 2px solid #cbd5e1; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
        tr:hover { background: #f8fafc; }
        .hero { background: #ecfdf5; }
        .sig-buy { background: #dcfce7; color: #15803d; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .sig-run { background: #fee2e2; color: #b91c1c; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .sig-warn { background: #fef9c3; color: #a16207; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .sig-watch { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        #logModal { display:none; position:fixed; top:10%; right:5%; width:45%; height:75%; background:white; border-radius:8px; box-shadow:0 10px 25px rgb(0 0 0 / 0.2); border:1px solid #cbd5e1; padding:20px; z-index:1000; overflow-y:auto; }
        #logModal h3 { margin-top:0; border-bottom:1px solid #e2e8f0; padding-bottom:8px; }
        #logContent { font-family: monospace; white-space: pre-wrap; background: #0f172a; color: #38bdf8; padding: 15px; border-radius: 6px; font-size: 13px; line-height: 1.5; }
    </style>
    <script>
        function showLog(pureId, subDir) {
            var modal = document.getElementById('logModal');
            var content = document.getElementById('logContent');
            var title = document.getElementById('logTitle');
            title.innerText = '個股追蹤日誌: ' + pureId;
            
            fetch('data/' + subDir + '/' + pureId + '-trend-backtest-live.txt?t=' + new Date().getTime())
                .then(response => {
                    if(!response.ok) throw new Error('日誌尚未生成');
                    return response.text();
                })
                .then(text => {
                    content.innerText = text;
                    modal.style.display = 'block';
                })
                .catch(err => {
                    content.innerText = '讀取日誌失敗: ' + err.message;
                    modal.style.display = 'block';
                });
        }
        function closeLog() {
            document.getElementById('logModal').style.display = 'none';
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>📊 stock-Quantum V3 Pro 交易策略訊號監控</h1>
        <div class="meta-info">掃描日期：20260522 ｜ 最終更新時間：1157 ｜ 收益高光門檻：20.0%</div>
        <table>
            <thead>
                <tr>
                    <th>代號</th>
                    <th>名稱 (點擊看日誌)</th>
                    <th>最新價</th>
                    <th>今日策略訊號</th>
                    <th>累積回測收益</th>
                    <th>交易次數</th>
                    <th>歷史勝率</th>
                    <th>核心判定依據與開盤指引</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </div>

    <div id="logModal">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="logTitle">個股追蹤日誌</h3>
            <button onclick="closeLog()" style="cursor:pointer; background:#ef4444; color:white; border:none; padding:4px 10px; border-radius:4px;">關閉</button>
        </div>
        <div id="logContent">載入中...</div>
    </div>
</body>
</html>
