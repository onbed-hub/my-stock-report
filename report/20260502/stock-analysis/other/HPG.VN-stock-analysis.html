            drawPlot(days);
        }

        // 初始繪圖 (預設手機看 40 天比較剛好，電腦看全部)
        const initCount = window.innerWidth < 600 ? 40 : 150;
        if(window.innerWidth < 600) {
             // 手機版自動切換到較短區間的按鈕狀態
             const btns = document.querySelectorAll('.btn');
             btns[2].classList.remove('active');
             btns[0].classList.add('active');
             drawPlot(20);
        } else {
             drawPlot(150);
        }
    </script>
</body>
</html>
