        function drawPlot(displayCount) {
            const data = rawData.slice(-displayCount);
            const x = data.map(d => d.Date);

            const jointHoverText = data.map(function(d) {
                return "<b>日期: " + d.Date + "</b><br>" +
                       "開盤: " + d.Open.toFixed(2) + "<br>" +
                       "最高: " + d.High.toFixed(2) + "<br>" +
                       "最低: " + d.Low.toFixed(2) + "<br>" +
                       "收盤: " + d.Close.toFixed(2) + "<br>" +
                       "<b>成交量: " + d.Volume.toLocaleString() + " 股</b>";
            });

            const candle = {
                x: x,
                open: data.map(d => d.Open),
                high: data.map(d => d.High),
                low: data.map(d => d.Low),
                close: data.map(d => d.Close),
                type: 'candlestick',
                name: 'K線',
                yaxis: 'y2',
                text: jointHoverText,
                hoverinfo: 'text',
                increasing: {line: {color: '#ef5350'}},
                decreasing: {line: {color: '#26a69a'}}
            };

            const ma5 = { x: x, y: data.map(d => d.MA_5), name: 'MA5', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ffa726', width: 1.2} };
            const ma10 = { x: x, y: data.map(d => d.MA_10), name: 'MA10', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#2196f3', width: 1.2} };
            const ma20 = { x: x, y: data.map(d => d.MA_20), name: 'MA20', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#9c27b0', width: 2} };
            const bUp = { x: x, y: data.map(d => d.Upper_Band), name: '布林上軌', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ccc', dash: 'dot', width: 1} };
            const bLo = { x: x, y: data.map(d => d.Lower_Band), name: '布林下軌', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ccc', dash: 'dot', width: 1}, fill: 'tonexty', fillcolor: 'rgba(200,200,200,0.05)' };

            const vol = {
                x: x,
                y: data.map(d => d.Volume),
                type: 'bar',
                name: '成交量',
                yaxis: 'y',
                text: jointHoverText,
                hoverinfo: 'text',
                hoverlabel: { namelength: 0 },
                marker: { color: data.map(d => d.Close >= d.Open ? '#ef5350' : '#26a69a') }
            };

            const layout = {
                xaxis: { type: 'category', rangeslider: { visible: false }, tickfont: { size: 10 } },
                yaxis: { domain: [0, 0.15], showgrid: false },
                yaxis2: { domain: [0.2, 1] },
                hovermode: 'x unified',
                showlegend: false,
                margin: { t: 10, b: 30, l: 50, r: 10 },
                template: 'plotly_white'
            };

            Plotly.newPlot('plot', [bUp, bLo, candle, ma5, ma10, ma20, vol], layout, { responsive: true, displayModeBar: false });
        }

        function updateRange(days, btn) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            drawPlot(days);
        }

        if(window.innerWidth < 600) {
             document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
             document.querySelectorAll('.btn')[0].classList.add('active');
             drawPlot(20);
        } else {
             drawPlot(150);
        }
    </script>
