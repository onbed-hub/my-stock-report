            const vol = { x: x, y: data.map(d => d.Volume), type: 'bar', name: '量', yaxis: 'y', marker: { color: data.map(d => d.Close >= d.Open ? '#ef5350' : '#26a69a') } };
            
            const layout = {
                xaxis: { type: 'category', rangeslider: { visible: false }, tickfont: { size: 10 } },
                yaxis: { domain: [0, 0.15], showgrid: false },
                yaxis2: { domain: [0.2, 1] },
                hovermode: 'x unified',
                showlegend: false, // 既然上面有說明卡了，這裡關掉讓畫面更寬
                margin: { t: 10, b: 30, l: 40, r: 10 },
                template: 'plotly_white'
            };

            Plotly.newPlot('plot', [vol, bUp, bLo, candle, ma5, ma10, ma20], layout, { responsive: true, displayModeBar: false });
        }

        function updateRange(days, btn) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            drawPlot(days);
        }

        // 初始偵測
        const initCount = window.innerWidth < 600 ? 30 : 150;
        if(window.innerWidth < 600) {
             document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
             document.querySelectorAll('.btn')[0].classList.add('active'); // 預設 20天
             drawPlot(20);
        } else {
             drawPlot(150);
        }
    </script>
</body>
</html>
