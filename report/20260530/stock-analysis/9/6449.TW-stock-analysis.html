    <style>
        body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f4f7f9; color: #334155; }

<body>

    </div>

    <script>
        const rawData = [{"Date": "2026-05-06", "Open": 176.5, "High": 176.5, "Low": 167.0, "Close": 171.0, "Volume": 765074.0, "MA_5": 0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-07", "Open": 177.0, "High": 186.5, "Low": 175.0, "Close": 179.0, "Volume": 2591301.0, "MA_5": 0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-08", "Open": 179.0, "High": 193.0, "Low": 178.0, "Close": 183.0, "Volume": 2769493.0, "MA_5": 0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-11", "Open": 186.0, "High": 186.0, "Low": 176.5, "Close": 180.5, "Volume": 1314376.0, "MA_5": 0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-12", "Open": 182.0, "High": 198.5, "Low": 177.5, "Close": 198.5, "Volume": 3836031.0, "MA_5": 182.4, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-13", "Open": 198.5, "High": 218.0, "Low": 190.0, "Close": 218.0, "Volume": 5154385.0, "MA_5": 191.8, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-14", "Open": 239.5, "High": 239.5, "Low": 228.5, "Close": 239.5, "Volume": 4227042.0, "MA_5": 203.9, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-15", "Open": 255.0, "High": 263.0, "Low": 253.0, "Close": 263.0, "Volume": 5701124.0, "MA_5": 219.9, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-18", "Open": 263.0, "High": 280.0, "Low": 254.0, "Close": 271.0, "Volume": 10245366.0, "MA_5": 238.0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-19", "Open": 259.0, "High": 270.0, "Low": 244.0, "Close": 244.5, "Volume": 2016724.0, "MA_5": 247.2, "MA_10": 214.8, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-20", "Open": 250.0, "High": 268.5, "Low": 247.0, "Close": 268.5, "Volume": 1492         function drawPlot(displayCount) {
            const data = rawData.slice(-displayCount);
            const x = data.map(d => d.Date);

            const candleText = data.map(d => 
                `<b>日期: \${d.Date}</b><br>` +
                `開盤: \${d.Open.toFixed(2)}<br>` +
                `最高: \${d.High.toFixed(2)}<br>` +
                `最低: \${d.Low.toFixed(2)}<br>` +
                `收盤: \${d.Close.toFixed(2)}`
            );

            const candle = { 
                x: x, 
                open: data.map(d => d.Open), 
                high: data.map(d => d.High), 
                low: data.map(d => d.Low), 
                close: data.map(d => d.Close), 
                type: 'candlestick', 
                name: 'K線', 
                yaxis: 'y2', 
                text: candleText,
                hoverinfo: 'text',
                increasing: {line: {color: '#ef5350'}}, 
                decreasing: {line: {color: '#26a69a'}} 
            };

            const ma5 = { x: x, y: data.map(d => d.MA_5), name: 'MA5', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ffa726', width: 1.2} };
            const ma10 = { x: x, y: data.map(d => d.MA_10), name: 'MA10', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#2196f3', width: 1.2} };
            const ma20 = { x: x, y: data.map(d => d.MA_20), name: 'MA20', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#9c27b0', width: 2} };
            const bUp = { x: x, y: data.map(d => d.Upper_Band), name: '布林上軌', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ccc', dash: 'dot', width: 1} };
            const bLo = { x: x, y: data.map(d => d.Lower_Band), name: '布林下軌', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ccc', dash: 'dot', width: 1}, fill: 'tonexty', fillcolor: 'rgba(200,200,200,0.05)' };

            const volHoverText = data.map(d => d.Volume.toLocaleString());
            const hiddenVolTrack = {
                x: x,
                y: data.map(d => d.Close), 
                type: 'scatter',
                mode: 'markers',
                name: '成交量',
                yaxis: 'y2',
                text: volHoverText,
                hovertemplate: '%{text}',
                marker: { opacity: 0, size: 1 }, 
                showlegend: false
            };

            const vol = {
                x: x,
                y: data.map(d => d.Volume),
                type: 'bar',
                name: '成交量(底)',
                yaxis: 'y',
                marker: { color: data.map(d => d.Close >= d.Open ? '#ef5350' : '#26a69a') },
                hoverinfo: 'skip' 
            };

            const layout = {
                xaxis: { type: 'category', rangeslider: { visible: false }, tickfont: { size: 10 } },
                yaxis: { domain: [0, 0.15], showgrid: false },
                yaxis2: { domain: [0.2, 1] },
                hovermode: 'x unified',
                showlegend: false,
                margin: { t: 10, b: 30, l: 50, r: 10 },
                template: 'plotly_white'
            };

            Plotly.newPlot('plot', [bUp, bLo, candle, ma5, ma10, ma20, hiddenVolTrack, vol], layout, { responsive: true, displayModeBar: false });
        }

        function updateRange(days, btn) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            drawPlot(days);
        }

        if(window.innerWidth < 600) {
             document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
             document.querySelectorAll('.btn')[0].classList.add('active');
             drawPlot(20);
        } else {
             drawPlot(150);
        }
    </script>
</body>
