            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            drawPlot(days);
        }

        if(window.innerWidth < 600) { drawPlot(20); } else { drawPlot(150); }
    </script>
</body>
</html>
