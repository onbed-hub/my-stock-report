
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創鉅材料(7918.TWO) - 20260530</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f4f7f9; color: #334155; }
        .container { max-width: 1100px; margin: 10px auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h3 { margin-top: 0; color: #1e293b; border-left: 4px solid #2563eb; padding-left: 10px; }
        .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .btn {
            padding: 6px 14px; border: 1px solid #e2e8f0; background: white; color: #64748b;
            border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600;
            transition: all 0.2s;
        }
        .btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        .legend-box {
            display: flex; gap: 12px; flex-wrap: wrap;
            background: #f8fafc; padding: 10px; border-radius: 8px;
            margin-bottom: 15px; font-size: 12px; border: 1px solid #f1f5f9;
        }
        .leg-item { display: flex; align-items: center; gap: 4px; font-weight: 500; }
        .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
        #plot { width: 100%; height: 65vh; min-height: 420px; }
        @media (max-width: 600px) {
            .container { margin: 0; border-radius: 0; padding: 10px; }
            h3 { font-size: 1rem; }
            .legend-box { gap: 8px; padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>創鉅材料(7918.TWO) 技術分析 (20260530)</h3>

        <div class="controls">
            <button class="btn" onclick="updateRange(20, this)">20天</button>
            <button class="btn" onclick="updateRange(30, this)">30天</button>
            <button class="btn" onclick="updateRange(60, this)">60天</button>
            <button class="btn active" onclick="updateRange(150, this)">全部</button>
        </div>

        <div class="legend-box">
            <div class="leg-item"><span class="dot" style="background:#ffa726"></span> MA5</div>
            <div class="leg-item"><span class="dot" style="background:#2196f3"></span> MA10</div>
            <div class="leg-item"><span class="dot" style="background:#9c27b0"></span> MA20</div>
            <div class="leg-item"><span class="dot" style="background:#ccc; border:1px dashed #999"></span> 布林通道 (上下軌)</div>
            <div class="leg-item"><span class="dot" style="background:#ef5350"></span> 漲</div>
            <div class="leg-item"><span class="dot" style="background:#26a69a"></span> 跌</div>
        </div>

        <div id="plot"></div>
    </div>

    <script>
        const rawData = [{"Date": "2026-05-07", "Open": 5.0, "High": 5.0, "Low": 5.0, "Close": 5.0, "Volume": 0.0, "MA_5": 0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-08", "Open": 5.0, "High": 5.0, "Low": 5.0, "Close": 5.0, "Volume": 0.0, "MA_5": 0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-11", "Open": 240.0, "High": 1025.0, "Low": 235.0, "Close": 849.0, "Volume": 2008028.0, "MA_5": 0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-12", "Open": 820.0, "High": 1115.0, "Low": 700.0, "Close": 1015.0, "Volume": 1092377.0, "MA_5": 0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-13", "Open": 1010.0, "High": 1130.0, "Low": 946.0, "Close": 1030.0, "Volume": 750828.0, "MA_5": 580.8, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-14", "Open": 1035.0, "High": 1195.0, "Low": 1005.0, "Close": 1180.0, "Volume": 670844.0, "MA_5": 815.8, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-15", "Open": 1185.0, "High": 1585.0, "Low": 1135.0, "Close": 1580.0, "Volume": 806482.0, "MA_5": 1130.8, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-18", "Open": 1565.0, "High": 1565.0, "Low": 1245.0, "Close": 1450.0, "Volume": 492957.0, "MA_5": 1251.0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-19", "Open": 1455.0, "High": 1455.0, "Low": 1200.0, "Close": 1300.0, "Volume": 386439.0, "MA_5": 1308.0, "MA_10": 0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-20", "Open": 1250.0, "High": 1365.0, "Low": 1155.0, "Close": 1200.0, "Volume": 264692.0, "MA_5": 1342.0, "MA_10": 961.4, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-21", "Open": 1210.0, "High": 1355.0, "Low": 1160.0, "Close": 1275.0, "Volume": 248906.0, "MA_5": 1361.0, "MA_10": 1088.4, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-22", "Open": 1280.0, "High": 1330.0, "Low": 1145.0, "Close": 1170.0, "Volume": 218194.0, "MA_5": 1279.0, "MA_10": 1204.9, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-25", "Open": 1225.0, "High": 1330.0, "Low": 1195.0, "Close": 1240.0, "Volume": 294890.0, "MA_5": 1237.0, "MA_10": 1244.0, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-26", "Open": 1255.0, "High": 1255.0, "Low": 1115.0, "Close": 1180.0, "Volume": 281671.0, "MA_5": 1213.0, "MA_10": 1260.5, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-27", "Open": 1165.0, "High": 1280.0, "Low": 1165.0, "Close": 1250.0, "Volume": 173805.0, "MA_5": 1223.0, "MA_10": 1282.5, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-28", "Open": 1195.0, "High": 1250.0, "Low": 1150.0, "Close": 1190.0, "Volume": 148920.0, "MA_5": 1206.0, "MA_10": 1283.5, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-05-29", "Open": 1190.0, "High": 1245.0, "Low": 1165.0, "Close": 1170.0, "Volume": 154272.0, "MA_5": 1206.0, "MA_10": 1242.5, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}];

        function drawPlot(displayCount) {
            const data = rawData.slice(-displayCount);
            const x = data.map(d => d.Date);

            const candleText = data.map(d => 
                `<b>日期: \${d.Date}</b><br>` +
                `開盤: \${d.Open.toFixed(2)}<br>` +
                `最高: \${d.High.toFixed(2)}<br>` +
                `最低: \${d.Low.toFixed(2)}<br>` +
                `收盤: \${d.Close.toFixed(2)}`
            );

            const candle = { 
                x: x, 
                open: data.map(d => d.Open), 
                high: data.map(d => d.High), 
                low: data.map(d => d.Low), 
                close: data.map(d => d.Close), 
                type: 'candlestick', 
                name: 'K線', 
                yaxis: 'y2', 
                text: candleText,
                hoverinfo: 'text',
                increasing: {line: {color: '#ef5350'}}, 
                decreasing: {line: {color: '#26a69a'}} 
            };

            const ma5 = { x: x, y: data.map(d => d.MA_5), name: 'MA5', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ffa726', width: 1.2} };
            const ma10 = { x: x, y: data.map(d => d.MA_10), name: 'MA10', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#2196f3', width: 1.2} };
            const ma20 = { x: x, y: data.map(d => d.MA_20), name: 'MA20', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#9c27b0', width: 2} };
            const bUp = { x: x, y: data.map(d => d.Upper_Band), name: '布林上軌', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ccc', dash: 'dot', width: 1} };
            const bLo = { x: x, y: data.map(d => d.Lower_Band), name: '布林下軌', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ccc', dash: 'dot', width: 1}, fill: 'tonexty', fillcolor: 'rgba(200,200,200,0.05)' };

            const volHoverText = data.map(d => d.Volume.toLocaleString());
            const hiddenVolTrack = {
                x: x,
                y: data.map(d => d.Close), 
                type: 'scatter',
                mode: 'markers',
                name: '成交量',
                yaxis: 'y2',
                text: volHoverText,
                hovertemplate: '%{text}',
                marker: { opacity: 0, size: 1 }, 
                showlegend: false
            };

            const vol = {
                x: x,
                y: data.map(d => d.Volume),
                type: 'bar',
                name: '成交量(底)',
                yaxis: 'y',
                marker: { color: data.map(d => d.Close >= d.Open ? '#ef5350' : '#26a69a') },
                hoverinfo: 'skip' 
            };

            const layout = {
                xaxis: { type: 'category', rangeslider: { visible: false }, tickfont: { size: 10 } },
                yaxis: { domain: [0, 0.15], showgrid: false },
                yaxis2: { domain: [0.2, 1] },
                hovermode: 'x unified',
                showlegend: false,
                margin: { t: 10, b: 30, l: 50, r: 10 },
                template: 'plotly_white'
            };

            Plotly.newPlot('plot', [bUp, bLo, candle, ma5, ma10, ma20, hiddenVolTrack, vol], layout, { responsive: true, displayModeBar: false });
        }

        function updateRange(days, btn) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            drawPlot(days);
        }

        if(window.innerWidth < 600) {
             document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
             document.querySelectorAll('.btn')[0].classList.add('active');
             drawPlot(20);
        } else {
             drawPlot(150);
        }
    </script>
</body>
</html>
