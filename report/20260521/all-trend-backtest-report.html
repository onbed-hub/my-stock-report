
    <!DOCTYPE html><html><head>
        <meta charset='utf-8'><meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{prefix} 趨勢報告</title>{html_style}
    </head>
    <body><div class='container'>
        <a href="../../index.html" class="btn-back">← 返回儀表板</a>

        <h2>📈 {prefix.upper()} 趨勢回測策略報告 (V3 Pro)</h2>
        <div class="header-info">📅 回測起點：<span style="color:#2563eb;">{args.start_date}</span> | 📅 分析日期：{sim_date_str}</div>
        {rule_section}{filter_html}
        <div class='card' style="padding: 0; overflow: hidden; border-radius: 20px;">
            <div class="table-responsive">
                <table id='stockTable'>
                    <thead><tr>
                        <th onclick="sortTable(0)">代號 ↕️</th><th onclick="sortTable(1)">名稱 ↕️</th>
                        <th onclick="sortTable(2)">分類 ↕</th> <th onclick="sortTable(3)">現價 ↕</th>
                        <th onclick="sortTable(4)">訊號 ↕</th>
                        <th onclick="sortTable(5)">累積獲利 ↕️</th><th onclick="sortTable(6)">次數 ↕️</th>
                        <th onclick="sortTable(7)">勝率 ↕️</th><th>進場管道 & 狀態理由 ↕️</th>
                    </tr></thead>
                    <tbody>{rows_html}</tbody>
                </table>
            </div>
            <div id="pagination">
                <button onclick="changePage(-1)" id="prevBtn" class="page-btn">⬅️ 上一頁</button>
                <span id="pageInfo" style="font-weight:bold; color:#1e3a8a;"></span>
                <button onclick="changePage(1)" id="nextBtn" class="page-btn">下一頁 ➡️</button>
            </div>
        </div>
    </div>
    <div id="logModal" class="modal"><div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 id="logTitle" style="color:#1e3a8a; font-size:2.2rem; margin-top:0;"></h3>
        <div id="logContent"></div>
    </div></div>
    <script>

    let currentPage = 1;
    const pageSize = 30;
    
    // 🎯 修正點 1：全域宣告時立即拉取 DOM 陣列打底，確保 filter 未執行前排序與分頁功能不崩潰
    let filteredRows = Array.from(document.querySelectorAll('#stockTable tbody tr'));
    const markLists = {mark_lists_json};

    let selectedSectors = new Set();

    function initSectorFilter() {
        const sectors = new Set();
        document.querySelectorAll('#stockTable tbody tr').forEach(tr => {
            const s = tr.getAttribute('data-sector');
            if (s && s !== '未知') sectors.add(s);
        });

        const tagBox = document.getElementById('sectorTagBox');
        if (!tagBox) return;
        tagBox.innerHTML = '';

        Array.from(sectors).sort().forEach(s => {
            const span = document.createElement('span');
            span.className = 'sector-tag';
            span.innerText = s;
            span.onclick = function() {
                if (selectedSectors.has(s)) {
                    selectedSectors.delete(s);
                    this.classList.remove('active');
                } else {
                    selectedSectors.add(s);
                    this.classList.add('active');
                }
                filter();
            };
            tagBox.appendChild(span);
        });
    }

    function filter() {
        const search = document.getElementById('searchInput').value.toUpperCase().trim();
        const pFilterVal = document.getElementById('pFilter').value;
        const sFilter = document.getElementById('sFilter').value;
        const mFilter = document.getElementById('mFilter').value;
        const typeFilter = document.getElementById('typeFilter').value;

        const allRows = Array.from(document.querySelectorAll('#stockTable tbody tr'));

        filteredRows = allRows.filter(row => {
            const idFull = row.cells[0].textContent.toUpperCase().trim();
            const idPure = idFull.split('.')[0];
            const nameText = row.cells[1].textContent.toUpperCase().trim();
            const rowSector = row.getAttribute('data-sector');
            const rowType = row.getAttribute('data-type');

            // 🎯 修正點 2：加入防閱性保護，避免 cells 索引缺漏或 PnL 欄位包含非數字髒數據導致 filter 斷言停止
            const signalText = row.cells[4] ? row.cells[4].textContent : '';
            let rawPnl = row.cells[5] ? row.cells[5].textContent.replace('%', '') : '0';
            const pnlValue = isNaN(parseFloat(rawPnl)) ? 0 : parseFloat(rawPnl);

            const matchSearch = idFull.includes(search) || nameText.includes(search);
            const matchType = (typeFilter === 'all') ? true : (rowType === typeFilter);
            const matchSector = (selectedSectors.size === 0) ? true : selectedSectors.has(rowSector);

            let matchPnl = (pFilterVal === "loss") ? pnlValue < 0 : (pFilterVal === "-999" ? true : pnlValue >= parseFloat(pFilterVal));
            let matchSignal = (sFilter === 'all') ? true : signalText.includes(sFilter);
            let matchMark = (mFilter === 'all') ? true : (markLists[mFilter] || []).some(item => item.trim() === idPure);

            return matchSearch && matchType && matchSector && matchPnl && matchSignal && matchMark;
        });

        currentPage = 1;
        updateDisplay();
    }

    function updateDisplay() {
        const allRows = document.querySelectorAll('#stockTable tbody tr');
        allRows.forEach(row => row.style.display = 'none');
        const totalPages = Math.ceil(filteredRows.length / pageSize) || 1;
        const start = (currentPage - 1) * pageSize;
        filteredRows.slice(start, start + pageSize).forEach(row => row.style.display = '');

        document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${totalPages} 頁 (共 ${filteredRows.length} 檔)`;
        document.getElementById('prevBtn').disabled = (currentPage === 1);
        document.getElementById('nextBtn').disabled = (currentPage === totalPages);
    }
    function changePage(step) { currentPage += step; updateDisplay(); }

    let sortDir = 1; let lastSortCol = -1;
    function sortTable(n) {
        const table = document.getElementById("stockTable");
        const tbody = table.querySelector("tbody");
        if (lastSortCol === n) { sortDir *= -1; } else { sortDir = -1; lastSortCol = n; }
        
        // 🎯 修正點 3：排序對象改為全域當前的 filteredRows，確保分頁與過濾邏輯聯動不紊亂
        filteredRows.sort((a, b) => {
            let x = a.cells[n].innerText.trim(); let y = b.cells[n].innerText.trim();
            let xVal = isNaN(parseFloat(x.replace(/%/g,''))) ? x.toLowerCase() : parseFloat(x.replace(/%/g,''));
            let yVal = isNaN(parseFloat(y.replace(/%/g,''))) ? y.toLowerCase() : parseFloat(y.replace(/%/g,''));
            return xVal < yVal ? -1 * sortDir : (xVal > yVal ? 1 * sortDir : 0);
        });
        
        // 將重新排序後的 DOM 節點渲染回 tbody 中
        filteredRows.forEach(row => tbody.appendChild(row));
        
        // 排序後直接刷新畫面
        currentPage = 1;
        updateDisplay();
    }

    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('pFilter').value = '-999';
        document.getElementById('sFilter').value = 'all';
        document.getElementById('mFilter').value = 'all';
        document.getElementById('typeFilter').value = 'all';

        selectedSectors.clear();
        document.querySelectorAll('.sector-tag').forEach(t => t.classList.remove('active'));
        filter();
    }

    function showLog(pureId, subDir) {
        var logPath = 'data/' + subDir + '/' + pureId + '-trend-backtest-report.txt';
        var modalContent = document.querySelector('.modal-content');

        resetModalStyleForText();

        if (modalContent) {
            modalContent.style.width = '85%';
            modalContent.style.maxWidth = '1050px';
            modalContent.style.padding = '25px';
        }

        document.getElementById('logTitle').innerText = '📜 交易明細: ' + pureId;
        document.getElementById('logContent').innerText = '載入中...';
        document.getElementById('logModal').style.display = 'block';

        fetch(logPath)
            .then(function(response) {
                if (!response.ok) throw new Error('File not found');
                return response.text();
            })
            .then(function(data) {
                document.getElementById('logContent').innerText = data;
            })
            .catch(function(err) {
                document.getElementById('logContent').innerText = '❌ 無法讀取明細，路徑為: ' + logPath;
            });
    }

    function showAnalysisModal(fullId, subDir) {
        var analysisPath = 'stock-analysis/' + subDir + '/' + fullId + '-stock-analysis.html';
        var logTitle = document.getElementById('logTitle');
        if (logTitle) { logTitle.style.display = ''; }

        applyIframeModalStyle('🔍 技術分析圖表: ' + fullId, '85%', '1200px', '75vh', analysisPath);
    }

    function showBusinessLog(fullId, subDir) {
        var bizPath = '/my-stock-report/basic_data/balance-sheet/' + subDir + '/' + fullId + '-industry-business.txt?v=' + new Date().getTime();
        var modalContent = document.querySelector('.modal-content');
        var logTitle = document.getElementById('logTitle');

        if (logTitle) { logTitle.style.display = ''; }

        resetModalStyleForText();

        if (modalContent) {
            modalContent.style.width = '85%';
            modalContent.style.maxWidth = '950px';
            modalContent.style.padding = '25px';
        }

        document.getElementById('logTitle').innerText = '🏭 產業與營收結構: ' + fullId;
        document.getElementById('logContent').innerText = '讀取中...';
        document.getElementById('logModal').style.display = 'block';

        fetch(bizPath)
            .then(function(response) { return response.text(); })
            .then(function(data) { document.getElementById('logContent').innerText = data; })
            .catch(function(err) { document.getElementById('logContent').innerHTML = '❌ 無法讀取產業資料'; });
    }

    function showBalanceSheetModal(fullId, subDir) {
        var bsPath = '/my-stock-report/basic_data/balance-sheet/' + subDir + '/' + fullId + '-balance-sheet.html';
        var pureId = fullId.split('.')[0];
        var ext = fullId.split('.')[1] ? fullId.split('.')[1].toLowerCase() : '';
        var altFullId = ext ? (pureId + '.' + ext) : fullId;
        var altBsPath = '/my-stock-report/basic_data/balance-sheet/' + subDir + '/' + altFullId + '-balance-sheet.html';

        var modalContent = document.querySelector('.modal-content');
        var logContent = document.getElementById('logContent');
        var logTitle = document.getElementById('logTitle');

        if (modalContent) {
            modalContent.style.background = '#ffffff';
            modalContent.style.width = '90%';
            modalContent.style.maxWidth = '820px';
            modalContent.style.margin = '3% auto';
            modalContent.style.padding = '0px';
            modalContent.style.borderRadius = '12px';
            modalContent.style.boxShadow = '0 25px 50px -12px rgba(0, 0, 0, 0.25)';
            modalContent.style.overflow = 'hidden';
        }

        if (logContent) {
            logContent.style.background = 'transparent';
            logContent.style.padding = '0px';
            logContent.style.margin = '0px';
        }
        if (logTitle) {
            logTitle.style.display = 'none';
        }

        logContent.innerHTML = '<div id="bsLoading" style="text-align:center; padding: 40px; color:#64748b; font-size:1.1rem; background:#ffffff;">🔍 正在檢查財報資料庫...</div>';
        document.getElementById('logModal').style.display = 'block';

        fetch(bsPath, { method: 'HEAD' })
            .then(function(res) { if (res.ok) { loadIframe(bsPath); } else { return fetch(altBsPath, { method: 'HEAD' }); } })
            .then(function(res2) { if (res2) { if (res2.ok) { loadIframe(altBsPath); } else { showNoReportMessage(); } } })
            .catch(function(err) { loadIframe(bsPath); });

        function loadIframe(targetPath) {
            logContent.innerHTML = '<iframe id="bsIframe" src="' + targetPath + '" style="width:100%; height:80vh; border:none; background:#ffffff; display:block; margin:0; padding:0;"></iframe>';
        }

        function showNoReportMessage() {
            logContent.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 0px; margin: 0;">
                    <div style="font-size: 3.5rem; margin-bottom: 15px;">⚠️</div>
                    <h4 style="color: #334155; font-size: 1.4rem; margin: 0 0 10px 0; font-weight: 600;">暫無財報數據</h4>
                    <p style="color: #64748b; font-size: 1rem; margin: 0;">
                        代號 <span style="color: #0f172a; font-weight: bold;">${fullId}</span> 目前在 <code>basic_data/balance-sheet/${subDir}/</code> 資料夾中尚未生成對應的 HTML 報表。
                    </p>
                </div>
            `;
        }
    }

    function applyIframeModalStyle(titleText, widthStr, maxWidthStr, heightStr, srcPath) {
        var modalContent = document.querySelector('.modal-content');
        var logContent = document.getElementById('logContent');
        var logTitle = document.getElementById('logTitle');

        if (modalContent) {
            modalContent.style.background = '#f8fafc';
            modalContent.style.width = widthStr;
            modalContent.style.maxWidth = maxWidthStr;
            modalContent.style.margin = '1.5% auto';
            modalContent.style.padding = '20px 25px';
            modalContent.style.borderRadius = '16px';
            modalContent.style.border = '1px solid #e2e8f0';
        }
        if (logContent) {
            logContent.style.background = 'transparent';
            logContent.style.padding = '0px';
            logContent.style.marginTop = '15px';
            logContent.style.fontFamily = 'inherit';
            logContent.style.whiteSpace = 'normal';
        }
        if (logTitle) {
            logTitle.innerHTML = '<span style="color:#2563eb; font-weight:bold; font-size:1.6rem;">' + titleText + '</span>';
        }
        logContent.innerHTML = '<iframe src="' + srcPath + '" style="width:100%; height:' + heightStr + '; border:none; background:white; display:block; border-radius:12px;"></iframe>';
        document.getElementById('logModal').style.display = 'block';
    }

    function resetModalStyleForText() {
        var modalContent = document.querySelector('.modal-content');
        var logContent = document.getElementById('logContent');
        if (modalContent) {
            modalContent.style.background = '#fff';
            modalContent.style.width = '90%';
            modalContent.style.maxWidth = 'none';
            modalContent.style.margin = '2% auto';
            modalContent.style.padding = '30px';
            modalContent.style.borderRadius = '15px';
        }
        if (logContent) {
            logContent.style.background = '#0f172a';
            logContent.style.padding = '25px';
            logContent.style.borderRadius = '10px';
            logContent.style.fontFamily = 'monospace';
            logContent.style.whiteSpace = 'pre-wrap';
            logContent.style.width = '100%';
            logContent.style.boxSizing = 'border-box';
        }
    }

    function closeModal() {
        document.getElementById("logModal").style.display = "none";
        document.getElementById('logContent').innerHTML = '';

        var logTitle = document.getElementById('logTitle');
        if (logTitle) {
            logTitle.style.display = '';
            logTitle.style.margin = '';
            logTitle.innerText = '';
        }

        var modalContent = document.querySelector('.modal-content');
        if (modalContent) {
            modalContent.style.background = '#fff';
            modalContent.style.width = '90%';
            modalContent.style.maxWidth = 'none';
            modalContent.style.margin = '2% auto';
            modalContent.style.padding = '30px';
            modalContent.style.borderRadius = '15px';
            modalContent.style.overflow = '';
        }
    }

    // 🎯 修正點 4：整合 window.onclick 全域點擊關閉事件，清除原先重複宣告的邏輯衝突
    window.onclick = function(e) {
        var modal = document.getElementById("logModal");
        if (e.target == modal) {
            closeModal();
        }
    };

    // 頁面載入完成後的初始化
    document.addEventListener("DOMContentLoaded", function() {
        initSectorFilter();
        filter();
    });

    </script></body></html>
