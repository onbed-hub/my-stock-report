        const vol = { x: x, y: data.map(d => d.Volume), type: 'bar', name: '量', yaxis: 'y', marker: { color: data.map(d => d.Close >= d.Open ? '#ef5350' : '#26a69a') } };
        const layout = { xaxis: { type: 'category', rangeslider: { visible: false } }, yaxis: { domain: [0, 0.15], showgrid: false }, yaxis2: { domain: [0.2, 1] }, hovermode: 'x unified', legend: { orientation: 'h', y: 1.1 }, margin: { t: 50, b: 50, l: 50, r: 50 }, template: 'plotly_white' };
        Plotly.newPlot('plot', [vol, bUp, bLo, candle, ma5, ma10, ma20], layout);
    </script>
