
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台智雲(7735.TWO) - 20260625</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f4f7f9; color: #334155; }
        .container { max-width: 1100px; margin: 10px auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h3 { margin-top: 0; color: #1e293b; border-left: 4px solid #2563eb; padding-left: 10px; }
        .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .btn {
            padding: 6px 14px; border: 1px solid #e2e8f0; background: white; color: #64748b;
            border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600;
            transition: all 0.2s;
        }
        .btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        .legend-box {
            display: flex; gap: 12px; flex-wrap: wrap;
            background: #f8fafc; padding: 10px; border-radius: 8px;
            margin-bottom: 15px; font-size: 12px; border: 1px solid #f1f5f9;
        }
        .leg-item { display: flex; align-items: center; gap: 4px; font-weight: 500; }
        .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
        #plot { width: 100%; height: 65vh; min-height: 420px; }
        @media (max-width: 600px) {
            .container { margin: 0; border-radius: 0; padding: 10px; }
            h3 { font-size: 1rem; }
            .legend-box { gap: 8px; padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>台智雲(7735.TWO) 技術分析 (20260625)</h3>

        <div class="controls">
            <button class="btn" onclick="updateRange(20, this)">20天</button>
            <button class="btn" onclick="updateRange(30, this)">30天</button>
            <button class="btn" onclick="updateRange(60, this)">60天</button>
            <button class="btn active" onclick="updateRange(150, this)">全部</button>
        </div>

        <div class="legend-box">
            <div class="leg-item"><span class="dot" style="background:#ffa726"></span> MA5</div>
            <div class="leg-item"><span class="dot" style="background:#2196f3"></span> MA10</div>
            <div class="leg-item"><span class="dot" style="background:#9c27b0"></span> MA20</div>
            <div class="leg-item"><span class="dot" style="background:#ccc; border:1px dashed #999"></span> 布林通道 (上下軌)</div>
            <div class="leg-item"><span class="dot" style="background:#ef5350"></span> 漲</div>
            <div class="leg-item"><span class="dot" style="background:#26a69a"></span> 跌</div>
        </div>

        <div id="plot"></div>
    </div>

    <script>
        const rawData = [{"Date": "2026-05-29", "Open": 84.5, "High": 378, "Low": 84.5, "Close": 350, "Volume": 1276766, "MA_5": 0, "MA_10": 350, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-01", "Open": 335, "High": 352.5, "Low": 253.5, "Close": 270, "Volume": 758205, "MA_5": 0, "MA_10": 310, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-02", "Open": 270, "High": 276.5, "Low": 238, "Close": 252, "Volume": 329611, "MA_5": 0, "MA_10": 290.6666666667, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-03", "Open": 247, "High": 252, "Low": 227, "Close": 239, "Volume": 275041, "MA_5": 0, "MA_10": 277.75, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-04", "Open": 239, "High": 260, "Low": 232, "Close": 249.5, "Volume": 153004, "MA_5": 272.1, "MA_10": 272.1, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-05", "Open": 251, "High": 251, "Low": 221, "Close": 226, "Volume": 162361, "MA_5": 247.3, "MA_10": 264.4166666667, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-08", "Open": 223, "High": 226, "Low": 209, "Close": 222, "Volume": 62788, "MA_5": 237.7, "MA_10": 258.3571428571, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-09", "Open": 217, "High": 250, "Low": 216, "Close": 249, "Volume": 80972, "MA_5": 237.1, "MA_10": 257.1875, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-10", "Open": 246, "High": 247, "Low": 221, "Close": 229, "Volume": 85624, "MA_5": 235.1, "MA_10": 254.0555555556, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-11", "Open": 223, "High": 230, "Low": 209.5, "Close": 223, "Volume": 76009, "MA_5": 229.8, "MA_10": 250.95, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-12", "Open": 230, "High": 230.5, "Low": 214, "Close": 221.5, "Volume": 49221, "MA_5": 228.9, "MA_10": 238.1, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-15", "Open": 218, "High": 221.5, "Low": 210.5, "Close": 214, "Volume": 86418, "MA_5": 227.3, "MA_10": 232.5, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-16", "Open": 214, "High": 214, "Low": 209, "Close": 214, "Volume": 31145, "MA_5": 220.3, "MA_10": 228.7, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-17", "Open": 209, "High": 215, "Low": 209, "Close": 215, "Volume": 14895, "MA_5": 217.5, "MA_10": 226.3, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-18", "Open": 210, "High": 218, "Low": 209, "Close": 210, "Volume": 24780, "MA_5": 214.9, "MA_10": 222.35, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-22", "Open": 209, "High": 213, "Low": 208.5, "Close": 209, "Volume": 28753, "MA_5": 212.4, "MA_10": 220.65, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-23", "Open": 209, "High": 211, "Low": 199, "Close": 199, "Volume": 50907, "MA_5": 209.4, "MA_10": 218.35, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-24", "Open": 199, "High": 207, "Low": 190, "Close": 207, "Volume": 46477, "MA_5": 208, "MA_10": 214.15, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}, {"Date": "2026-06-25", "Open": 209, "High": 241, "Low": 207, "Close": 238, "Volume": 121291, "MA_5": 212.6, "MA_10": 215.05, "MA_20": 0, "Upper_Band": 0, "Lower_Band": 0, "BOLL": 0}];

        function drawPlot(displayCount) {
            const data = rawData.slice(-displayCount);
            const x = data.map(d => d.Date);

            // 1. 定義一個兩邊通用的完美提示框內容（包含K線與成交量）
            const jointHoverText = data.map(function(d) {
                return "<b>日期: " + d.Date + "</b><br>" +
                       "開盤: " + d.Open.toFixed(2) + "<br>" +
                       "最高: " + d.High.toFixed(2) + "<br>" +
                       "最低: " + d.Low.toFixed(2) + "<br>" +
                       "收盤: " + d.Close.toFixed(2) + "<br>" +
                       "<b>成交量: " + d.Volume.toLocaleString() + " 股</b>";
            });

            // 2. K線圖層：綁定 jointHoverText
            const candle = { 
                x: x, 
                open: data.map(d => d.Open), 
                high: data.map(d => d.High), 
                low: data.map(d => d.Low), 
                close: data.map(d => d.Close), 
                type: 'candlestick', 
                name: 'K線', 
                yaxis: 'y2', 
                text: jointHoverText,
                hoverinfo: 'text',
                increasing: {line: {color: '#ef5350'}}, 
                decreasing: {line: {color: '#26a69a'}} 
            };

            const ma5 = { x: x, y: data.map(d => d.MA_5), name: 'MA5', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ffa726', width: 1.2} };
            const ma10 = { x: x, y: data.map(d => d.MA_10), name: 'MA10', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#2196f3', width: 1.2} };
            const ma20 = { x: x, y: data.map(d => d.MA_20), name: 'MA20', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#9c27b0', width: 2} };
            const bUp = { x: x, y: data.map(d => d.Upper_Band), name: '布林上軌', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ccc', dash: 'dot', width: 1} };
            const bLo = { x: x, y: data.map(d => d.Lower_Band), name: '布林下軌', type: 'scatter', mode: 'lines', yaxis: 'y2', line: {color: '#ccc', dash: 'dot', width: 1}, fill: 'tonexty', fillcolor: 'rgba(200,200,200,0.05)' };

            // 3. 成交量柱狀圖：同樣綁定 jointHoverText，並開啟 hoverinfo: 'text'
            // 同時加上 hoverlabel 設定，強制兩邊的提示框行為與外觀同步
            const vol = {
                x: x,
                y: data.map(d => d.Volume),
                type: 'bar',
                name: '成交量',
                yaxis: 'y',
                text: jointHoverText,
                hoverinfo: 'text', 
                hoverlabel: { namelength: 0 },
                marker: { color: data.map(d => d.Close >= d.Open ? '#ef5350' : '#26a69a') }
            };

            const layout = {
                xaxis: { type: 'category', rangeslider: { visible: false }, tickfont: { size: 10 } },
                yaxis: { domain: [0, 0.15], showgrid: false },
                yaxis2: { domain: [0.2, 1] },
                hovermode: 'x unified', // 縱向對齊虛線
                showlegend: false,
                margin: { t: 10, b: 30, l: 50, r: 10 },
                template: 'plotly_white'
            };

            Plotly.newPlot('plot', [bUp, bLo, candle, ma5, ma10, ma20, vol], layout, { responsive: true, displayModeBar: false });
        }

        function updateRange(days, btn) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            drawPlot(days);
        }

        if(window.innerWidth < 600) {
             document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
             document.querySelectorAll('.btn')[0].classList.add('active');
             drawPlot(20);
        } else {
             drawPlot(150);
        }
    </script>
</body>
</html>
